<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f8f7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="LaundryPro — laundry picked up, cleaned and delivered to your door within 24 hours. Track every order in real time."
    />
    <!-- Open Graph / Twitter (public marketing site) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LaundryPro" />
    <meta property="og:title" content="LaundryPro — Fresh laundry, folded & delivered" />
    <meta
      property="og:description"
      content="Laundry picked up, cleaned and delivered within 24 hours — tracked at every step, from our truck to your doorstep."
    />
    <!-- PNG raster (social crawlers reject SVG images); swap to an absolute URL
         with your production origin before go-live. -->
    <meta property="og:image" content="/og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LaundryPro — Fresh laundry, folded & delivered" />
    <meta
      name="twitter:description"
      content="Laundry picked up, cleaned and delivered within 24 hours — tracked at every step."
    />
    <meta name="twitter:image" content="/og-cover.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "LaundryPro",
        "description": "Laundry and dry-cleaning service with same-day pickup and 24-hour delivery, tracked in real time.",
        "url": "/",
        "logo": "/favicon.svg",
        "priceRange": "₹₹",
        "openingHours": "Mo-Su 07:00-22:00",
        "areaServed": "India",
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.9",
          "reviewCount": "12000"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>LaundryPro — Fresh laundry, folded & delivered</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
