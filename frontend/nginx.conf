# Static SPA served behind the Caddy edge. Caddy compresses (zstd/gzip) and
# adds security headers, so no gzip/header directives are needed here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed production assets are immutable; cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback so client routes (/app, /login, /settings, …) deep-link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
